<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Her Walk Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Press+Start+2P&family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --outline: #18141c;
      --gold-accent: #ffe74c;

      /* Dynamically Interpolated Atmosphere Variables */
      --sky-top: #74c0fc;
      --sky-mid: #c5f6fa;
      --sky-bottom: #fff3bf;
      --celestial-x: 240px;
      --celestial-y: 120px;
      --celestial-size: 64px;
      --celestial-color: #fff9db;
      --celestial-glow: rgba(255, 243, 191, 0.75);
      --mountain-far: #8ecae6;
      --hill-mid: #74c69d;
      --hill-near: #52b788;
      --ambient-tint: rgba(255, 248, 220, 0.08);
      --star-opacity: 0;
      --cloud-opacity: 0.92;
      --lamp-glow-opacity: 0.05;
      --house-light-opacity: 0.25;
      --memory-halo: rgba(255, 236, 153, 0.78);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #171522;
      font-family: 'Quicksand', sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ========================================================================
       FULL-SCREEN RESPONSIVE SCENIC VIEWPORT (Mobile & Desktop)
       ======================================================================== */
    .stage-frame {
      width: 100vw;
      height: 100dvh;
      min-height: 420px;
      position: relative;
      overflow: hidden;
      background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 56%, var(--sky-bottom) 100%);
      user-select: none;
    }

    /* Moving Sun / Moon Arc Across the Sky */
    .celestial-orb {
      position: absolute;
      left: var(--celestial-x);
      top: var(--celestial-y);
      width: var(--celestial-size);
      height: var(--celestial-size);
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: var(--celestial-color);
      box-shadow: 0 0 52px 20px var(--celestial-glow);
      pointer-events: none;
      z-index: 1;
    }

    /* Twinkling Evening Stars */
    .stars-2d {
      position: absolute;
      inset: 0;
      opacity: var(--star-opacity);
      background-image:
        radial-gradient(2.5px 2.5px at 10% 10%, #ffffff, transparent),
        radial-gradient(2px 2px at 24% 18%, #ffe74c, transparent),
        radial-gradient(3px 3px at 38% 8%, #ffffff, transparent),
        radial-gradient(2px 2px at 54% 16%, #ffe74c, transparent),
        radial-gradient(2.5px 2.5px at 68% 11%, #ffffff, transparent),
        radial-gradient(2px 2px at 82% 17%, #ffe74c, transparent),
        radial-gradient(3px 3px at 92% 10%, #ffffff, transparent);
      pointer-events: none;
      z-index: 1;
    }

    /* Ambient Atmospheric Lighting Wash */
    .atmosphere-tint-overlay {
      position: absolute;
      inset: 0;
      background: var(--ambient-tint);
      pointer-events: none;
      z-index: 12;
    }

    /* ========================================================================
       MULTI-LAYERED 2D PARALLAX SKY, MOUNTAINS & ROLLING HILLS
       ======================================================================== */
    .parallax-sky-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      will-change: transform;
      opacity: var(--cloud-opacity);
    }

    .cloud-2d {
      position: absolute;
      width: 138px;
      height: 36px;
      background: rgba(255, 252, 245, 0.92);
      border-radius: 999px;
      box-shadow: 0 6px 14px rgba(24, 20, 28, 0.08);
    }
    .cloud-2d::before {
      content: '';
      position: absolute;
      top: -17px;
      left: 24px;
      width: 52px;
      height: 38px;
      background: inherit;
      border-radius: 50%;
    }
    .cloud-2d::after {
      content: '';
      position: absolute;
      top: -12px;
      right: 24px;
      width: 40px;
      height: 30px;
      background: inherit;
      border-radius: 50%;
    }

    .mountains-2d-layer {
      position: absolute;
      bottom: 88px;
      left: 0;
      width: 3600px;
      height: 190px;
      pointer-events: none;
      z-index: 2;
      will-change: transform;
    }

    .hills-2d-layer {
      position: absolute;
      bottom: 88px;
      left: 0;
      width: 4600px;
      height: 155px;
      pointer-events: none;
      z-index: 3;
      will-change: transform;
    }

    /* ========================================================================
       DYNAMICALLY SIZED SCROLLING 2D WORLD TRACK
       ======================================================================== */
    .world-track {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      will-change: transform;
      z-index: 4;
    }

    .scenic-tree {
      position: absolute;
      bottom: 88px;
      pointer-events: none;
    }

    .wooden-fence {
      position: absolute;
      bottom: 90px;
      height: 34px;
      pointer-events: none;
      z-index: 3;
    }

    /* Smooth 2D Streetlamps */
    .lamp-2d {
      position: absolute;
      bottom: 90px;
      width: 44px;
      height: 240px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 4;
    }
    .lamp-2d-halo {
      position: absolute;
      top: -46px;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 242, 117, 0.85) 0%, rgba(255, 242, 117, 0) 72%);
      opacity: var(--lamp-glow-opacity);
      pointer-events: none;
    }
    .lamp-2d-bulb {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ffffff 0%, #fff200 65%, #f4a261 100%);
      border: 3px solid var(--outline);
      position: relative;
      z-index: 2;
    }
    .lamp-2d-pole {
      width: 7px;
      flex: 1;
      background: linear-gradient(90deg, #2b2636 0%, #18141c 100%);
      margin-top: -2px;
      border-radius: 3px;
    }

    /* ========================================================================
       SMOOTH 2D TWIN-GABLE GREEN HOUSE AT END OF THE ROAD
       ======================================================================== */
    .house-2d-wrapper {
      position: absolute;
      bottom: 90px;
      width: 700px;
      height: 264px;
      z-index: 6;
    }

    .house-warm-glow {
      opacity: var(--house-light-opacity);
    }

    /* ========================================================================
       SMOOTH 2D GRASS VERGE & CEMENT ROAD
       ======================================================================== */
    .grass-verge-2d {
      position: absolute;
      bottom: 74px;
      left: 0;
      width: 100%;
      height: 18px;
      background: linear-gradient(180deg, #52b788 0%, #40916c 100%);
      border-top: 3px solid var(--outline);
      border-bottom: 3px solid #7f5539;
      z-index: 5;
    }

    .driveway-2d {
      position: absolute;
      top: -3px;
      width: 120px;
      height: 21px;
      background: linear-gradient(180deg, #dfe3e8 0%, #cfd4dc 100%);
      border-left: 3px solid var(--outline);
      border-right: 3px solid var(--outline);
      z-index: 6;
    }

    .cement-road-2d {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 74px;
      background: linear-gradient(180deg, #dfe3e8 0%, #cfd4dc 70%, #bfc5ce 100%);
      z-index: 4;
      cursor: pointer;
    }

    .road-dashes-2d {
      position: absolute;
      top: 27px;
      left: 0;
      width: 100%;
      height: 16px;
      background-image: repeating-linear-gradient(
        90deg,
        #9da3ad 0px,
        #9da3ad 96px,
        transparent 96px,
        transparent 216px
      );
      opacity: 0.85;
    }

    /* ========================================================================
       SMOOTH 2D FLOATING REMINISCING PICTURE FRAMES
       ======================================================================== */
    .reminisce-slot {
      position: absolute;
      bottom: 124px;
      width: 258px;
      height: 296px;
      z-index: 14;
      pointer-events: none;
    }

    .floating-memory-frame {
      position: relative;
      width: 100%;
      height: 100%;
      opacity: 0;
      filter: blur(3px);
      transform: translateY(72px) scale(0.84) rotate(-2deg);
      transition:
        opacity 0.65s ease,
        transform 0.8s cubic-bezier(0.22, 1, 0.36, 1),
        filter 0.6s ease;
      will-change: transform, opacity;
      cursor: pointer;

      background: linear-gradient(180deg, #fffdf9 0%, #fbf5e8 100%);
      border: 3.5px solid var(--outline);
      border-radius: 18px;
      padding: 13px 13px 14px 13px;
      box-shadow:
        0 22px 42px rgba(24, 20, 28, 0.35),
        0 0 28px 6px var(--memory-halo);
      display: flex;
      flex-direction: column;
    }

    .reminisce-slot.is-open .floating-memory-frame {
      opacity: 1;
      filter: blur(0px);
      transform: translateY(0px) scale(1) rotate(0deg);
      pointer-events: auto;
      animation: smooth2dFloat 3.2s ease-in-out 0.8s infinite alternate;
    }

    .reminisce-slot.is-dissolving .floating-memory-frame {
      opacity: 0;
      filter: blur(4px);
      transform: translateY(-28px) scale(0.92) rotate(-1.5deg);
      pointer-events: none;
      animation: none;
    }

    @keyframes smooth2dFloat {
      0% { transform: translateY(0px) rotate(-0.5deg); }
      100% { transform: translateY(-10px) rotate(0.6deg); }
    }

    .reminisce-aura {
      position: absolute;
      inset: -18px;
      border-radius: 26px;
      background: radial-gradient(circle, var(--memory-halo) 0%, rgba(255, 231, 76, 0) 74%);
      opacity: 0;
      transition: opacity 0.6s ease;
      pointer-events: none;
      z-index: -1;
    }
    .reminisce-slot.is-open .reminisce-aura {
      opacity: 1;
    }

    .memory-ribbon-tag {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      background: #ffe74c;
      color: #18141c;
      border: 2.5px solid var(--outline);
      border-radius: 999px;
      padding: 3px 12px;
      font-family: 'Press Start 2P', monospace;
      font-size: 6.5px;
      white-space: nowrap;
      box-shadow: 0 3px 0 rgba(24, 20, 28, 0.25);
      z-index: 15;
    }

    .photo-viewport {
      width: 100%;
      height: 154px;
      border: 3px solid var(--outline);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      background: #2b2638;
      flex-shrink: 0;
    }

    .photo-viewport img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .photo-viewport::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(125deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 45%);
      pointer-events: none;
    }

    .greeting-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding-top: 7px;
    }

    .memory-title {
      font-family: 'Caveat', cursive;
      font-weight: 700;
      font-size: 21px;
      line-height: 1;
      color: #18141c;
    }

    .birthday-greeting-text {
      font-size: 11.5px;
      font-weight: 700;
      line-height: 1.32;
      color: #4a3f55;
      margin-top: 5px;
      padding: 0 4px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .art-2d {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }
    .art-2d-1 {
      background: linear-gradient(180deg, #90e0ef 0%, #caf0f8 62%, #74c69d 62%, #52b788 100%);
    }
    .art-2d-2 {
      background: linear-gradient(180deg, #ff9f1c 0%, #ffbf69 58%, #e9ecef 58%, #ced4da 100%);
    }
    .art-2d-3 {
      background: linear-gradient(180deg, #cdb4db 0%, #ffc8dd 64%, #ffafcc 100%);
    }

    /* ========================================================================
       CHIBI PIXEL-ART CHARACTER SPRITE (MOM)
       ======================================================================== */
    .mom-chibi-character {
      position: absolute;
      bottom: 60px;
      left: 160px;
      width: 112px;
      height: 146px;
      z-index: 18;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      pointer-events: none;
    }

    .chibi-svg-wrap {
      width: 112px;
      height: 144px;
      position: relative;
      z-index: 3;
      image-rendering: pixelated;
    }

    .mom-chibi-character.facing-left .chibi-svg-wrap {
      transform: scaleX(-1);
    }

    .mom-chibi-character.is-walking .chibi-svg-wrap {
      animation: chibiHop 0.34s steps(2) infinite alternate;
    }
    @keyframes chibiHop {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-4px); }
    }
    .mom-chibi-character.facing-left.is-walking .chibi-svg-wrap {
      animation: chibiHopLeft 0.34s steps(2) infinite alternate;
    }
    @keyframes chibiHopLeft {
      0% { transform: scaleX(-1) translateY(0px); }
      100% { transform: scaleX(-1) translateY(-4px); }
    }

    .mom-ground-shadow {
      position: absolute;
      bottom: -2px;
      width: 74px;
      height: 14px;
      background: radial-gradient(ellipse at center, rgba(24, 20, 28, 0.38) 0%, rgba(24, 20, 28, 0) 75%);
      border-radius: 50%;
      z-index: 1;
    }

    /* ========================================================================
       BOTTOM-LEFT DIRECTIONAL CONTROLS (< & >) — Mobile & Desktop Friendly
       ======================================================================== */
    .walk-pad {
      position: absolute;
      bottom: max(16px, env(safe-area-inset-bottom));
      left: max(16px, env(safe-area-inset-left));
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 35;
      touch-action: none;
    }

    .dir-btn {
      width: 58px;
      height: 58px;
      border-radius: 16px;
      background: rgba(24, 20, 28, 0.72);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 3px solid rgba(255, 255, 255, 0.85);
      color: #ffffff;
      font-family: 'Press Start 2P', monospace;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
      transition: transform 0.1s ease, background 0.15s ease, border-color 0.15s ease;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    .dir-btn:active,
    .dir-btn.pressed {
      transform: scale(0.92);
      background: rgba(255, 231, 76, 0.92);
      border-color: #18141c;
      color: #18141c;
    }

    /* ========================================================================
       ENTER THE HOUSE BUTTON (Appears when Mom reaches the Green House)
       ======================================================================== */
    .enter-house-btn {
      position: absolute;
      bottom: max(20px, env(safe-area-inset-bottom));
      right: max(18px, env(safe-area-inset-right));
      z-index: 35;
      background: linear-gradient(180deg, #ffe74c 0%, #ffb703 100%);
      color: #18141c;
      border: 3.5px solid var(--outline);
      border-radius: 999px;
      padding: 14px 22px;
      font-family: 'Quicksand', sans-serif;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 0.3px;
      cursor: pointer;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.4), 0 0 24px rgba(255, 231, 76, 0.75);
      display: flex;
      align-items: center;
      gap: 8px;

      opacity: 0;
      transform: translateY(20px) scale(0.9);
      pointer-events: none;
      transition: opacity 0.35s ease, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .enter-house-btn.visible {
      opacity: 1;
      transform: translateY(0px) scale(1);
      pointer-events: auto;
      animation: pulseHouseBtn 1.8s ease-in-out 0.4s infinite alternate;
    }

    .enter-house-btn:active {
      transform: scale(0.95);
    }

    @keyframes pulseHouseBtn {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(-4px) scale(1.04); }
    }

    /* ========================================================================
       MODALS (Picture Keepsake Modal & Inside-The-House Celebration Modal)
       ======================================================================== */
    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(16, 13, 24, 0.78);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 50;
    }
    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      width: min(92vw, 450px);
      max-height: 90dvh;
      overflow-y: auto;
      background: #fffdf9;
      border: 4px solid var(--outline);
      border-radius: 20px;
      padding: 18px;
      color: #231c24;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65), 0 0 32px rgba(255, 231, 76, 0.45);
      transform: translateY(24px) scale(0.93);
      transition: transform 0.38s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .modal-backdrop.open .modal-card {
      transform: translateY(0px) scale(1);
    }

    .modal-photo-box {
      width: 100%;
      height: 200px;
      border: 3.5px solid var(--outline);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 12px;
      flex-shrink: 0;
    }

    .modal-photo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .modal-title {
      font-family: 'Caveat', cursive;
      font-size: 30px;
      font-weight: 700;
      line-height: 1.1;
      color: #18141c;
    }

    .modal-note {
      font-size: 14px;
      font-weight: 600;
      color: #4a4254;
      margin: 8px 0 16px;
      line-height: 1.5;
    }

    .modal-action-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      width: 100%;
    }

    .modal-btn {
      background: #ffe74c;
      color: #18141c;
      border: 3px solid var(--outline);
      border-radius: 12px;
      padding: 10px 18px;
      font-family: 'Quicksand', sans-serif;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      transition: transform 0.12s ease;
    }
    .modal-btn:active {
      transform: scale(0.95);
    }
    .modal-btn.secondary {
      background: #e9ecef;
    }

    /* ========================================================================
       MOBILE PORTRAIT & SMALL-SCREEN RESPONSIVE ADAPTATIONS
       ======================================================================== */
    @media (max-width: 639px) {
      .reminisce-slot {
        width: 214px;
        height: 266px;
        bottom: 126px;
      }

      .floating-memory-frame {
        padding: 10px 10px 11px 10px;
        border-radius: 15px;
      }

      .photo-viewport {
        height: 130px;
      }

      .memory-title {
        font-size: 19px;
      }

      .birthday-greeting-text {
        font-size: 11px;
        -webkit-line-clamp: 3;
      }

      .mom-chibi-character {
        width: 96px;
        height: 126px;
        bottom: 62px;
      }

      .chibi-svg-wrap {
        width: 96px;
        height: 124px;
      }
      .chibi-svg-wrap svg {
        width: 96px;
        height: 124px;
      }

      .dir-btn {
        width: 54px;
        height: 54px;
        font-size: 16px;
      }

      .enter-house-btn {
        padding: 12px 16px;
        font-size: 13px;
        bottom: max(18px, env(safe-area-inset-bottom));
        right: max(14px, env(safe-area-inset-right));
      }

      .modal-photo-box {
        height: 165px;
      }
    }
  </style>
</head>
<body>

  <div class="stage-frame" id="stage-frame">
    <div class="celestial-orb"></div>
    <div class="stars-2d"></div>
    <div class="atmosphere-tint-overlay"></div>

    <!-- PARALLAX CLOUDS -->
    <div class="parallax-sky-layer" id="cloud-layer"></div>

    <!-- PARALLAX DISTANT MOUNTAINS -->
    <svg class="mountains-2d-layer" id="mountains-layer" viewBox="0 0 3600 190" preserveAspectRatio="none">
      <path d="M0,190 L0,118 L180,52 L360,114 L560,38 L780,108 L980,62 L1200,118 L1420,44 L1660,110 L1880,56 L2120,108 L2400,66 L2640,44 L2880,110 L3120,56 L3360,108 L3600,66 L3600,190 Z" fill="var(--mountain-far)" opacity="0.36"/>
    </svg>

    <!-- PARALLAX ROLLING MEADOW HILLS -->
    <svg class="hills-2d-layer" id="hills-layer" viewBox="0 0 4600 155" preserveAspectRatio="none">
      <path d="M0,155 L0,96 Q240,34 500,88 T1020,76 T1560,92 T2100,70 T2660,88 T3200,78 T3740,86 T4280,72 T4600,84 L4600,155 Z" fill="var(--hill-mid)" opacity="0.54"/>
      <path d="M0,155 L0,118 Q280,68 580,112 T1180,102 T1780,116 T2380,98 T3200,110 T3800,102 T4600,112 L4600,155 Z" fill="var(--hill-near)" opacity="0.64"/>
    </svg>

    <!-- ====================================================================
         DYNAMICALLY SIZED SMOOTH 2D COUNTRYSIDE WORLD TRACK
         ==================================================================== -->
    <div class="world-track" id="world-track">
      <!-- Dynamic Scenery (5 Tree Varieties, Fences, Streetlamps) -->
      <div id="scenery-prop-layer"></div>

      <!-- Dynamic Floating Memory Frames Rendered From pictures-data.js -->
      <div id="chapters-mount"></div>

      <!-- Smooth 2D Twin-Gable Green House at End of Road -->
      <div class="house-2d-wrapper" id="house-wrapper">
        <svg width="700" height="264" viewBox="0 0 700 264">
          <defs>

<script>

        <rect x="48" y="54" width="134" height="62" rx="22" fill="#ffffff" stroke="#18141c" stroke-width="3.5"/>

    'preset:graduation': `
      <svg class="art-2d art-2d-3" viewBox="0 0 230 150">
        <polygon points="56,34 84,22 112,34 84,46" fill="#18141c"/>
        <line x1="106" y1="36" x2="106" y2="54" stroke="#ffe74c" stroke-width="3"/>
        <polygon points="122,30 150,18 178,30 150,42" fill="#18141c"/>

      </svg>`

  function renderPictureHTML(picValue, altText) {
    if (typeof picValue === 'string' && picValue.startsWith('preset:')) {
      return PRESET_ILLUSTRATIONS[picValue] || PRESET_ILLUSTRATIONS['preset:family'];
    }
    return `<img src="${picValue}" alt="${altText}" />`;
  }

  const chaptersMount = document.getElementById('chapters-mount');
  picturesData.forEach((item, idx) => {
    const triggerX = FIRST_TRIGGER_X + idx * CHAPTER_SPACING;
    const chapterNum = String(idx + 1).padStart(2, '0');

    const slotEl = document.createElement('div');
    slotEl.className = 'reminisce-slot';
    slotEl.dataset.index = idx;
    slotEl.dataset.triggerX = triggerX;

    slotEl.innerHTML = `
      <div class="floating-memory-frame">
        <div class="reminisce-aura"></div>
        <div class="memory-ribbon-tag">✨ CHAPTER ${chapterNum}</div>
        <div class="photo-viewport" id="photo-slot-${idx}">
          ${renderPictureHTML(item.picture, item.title)}

        <div class="greeting-area">
          <div class="memory-title">${item.title}</div>
          <p class="birthday-greeting-text">"${item.message}"</p>

    chaptersMount.appendChild(slotEl);

  const slots = Array.from(document.querySelectorAll('.reminisce-slot'));

  /* ==========================================================================

    cloud.style.left = `${cx}px`;
    cloud.style.transform = `scale(${0.88 + ((cx / 190) % 3) * 0.12})`;
    cloudLayer.appendChild(cloud);
  }

  const sceneryLayer = document.getElementById('scenery-prop-layer');
  const TREE_SVGS = {
    oak: `
      <svg width="164" height="190" viewBox="0 0 164 190">
        <path d="M74,190 L76,120 L58,96 L65,91 L80,108 L95,88 L102,94 L86,118 L89,190 Z" fill="#6f4518" stroke="#18141c" stroke-width="3"/>

        <circle cx="112" cy="84" r="34" fill="#2d6a4f" stroke="#18141c" stroke-width="3"/>

    sakura: `
      <svg width="168" height="186" viewBox="0 0 168 186">
        <path d="M76,186 L78,118 L56,94 L63,89 L82,108 L104,86 L110,92 L88,118 L91,186 Z" fill="#5c3a21" stroke="#18141c" stroke-width="3"/>

        <circle cx="104" cy="70" r="16" fill="#ffc2d1"/>

    pine: `

        <rect x="60" y="164" width="16" height="50" fill="#582f0e" stroke="#18141c" stroke-width="3"/>

        <polygon points="68,46 26,124 110,124" fill="#2d6a4f" stroke="#18141c" stroke-width="3" stroke-linejoin="round"/>
        <polygon points="68,14 36,80 100,80" fill="#40916c" stroke="#18141c" stroke-width="3" stroke-linejoin="round"/>
        <polygon points="68,22 50,58 74,58" fill="#52b788"/>
      </svg>`,
    citrus: `
      <svg width="150" height="174" viewBox="0 0 150 174">
        <rect x="68" y="114" width="14" height="60" rx="4" fill="#7f4f24" stroke="#18141c" stroke-width="3"/>

        <circle cx="52" cy="76" r="5" fill="#f77f00" stroke="#18141c" stroke-width="1.8"/>

    willow: `
      <svg width="166" height="196" viewBox="0 0 166 196">
        <path d="M77,196 L79,112 L87,112 L89,196 Z" fill="#e9ecef" stroke="#18141c" stroke-width="3"/>

  };

  const treeTypes = ['oak', 'sakura', 'pine', 'citrus', 'willow'];
  let treeIdx = 0;

  function hexToRgb(hex) {
    const clean = hex.replace('#', '');
    return [
      parseInt(clean.slice(0, 2), 16),
      parseInt(clean.slice(2, 4), 16),
      parseInt(clean.slice(4, 6), 16)
    ];
  }

  function lerp(a, b, t) {
    return a + (b - a) * t;
  }

  function lerpColor(hexA, hexB, t) {
    const [r1, g1, b1] = hexToRgb(hexA);
    const [r2, g2, b2] = hexToRgb(hexB);
    return `rgb(${Math.round(lerp(r1, r2, t))}, ${Math.round(lerp(g1, g2, t))}, ${Math.round(lerp(b1, b2, t))})`;
  }

  function lerpRgba(rgbaA, rgbaB, t) {
    return `rgba(${Math.round(lerp(rgbaA[0], rgbaB[0], t))}, ${Math.round(lerp(rgbaA[1], rgbaB[1], t))}, ${Math.round(lerp(rgbaA[2], rgbaB[2], t))}, ${lerp(rgbaA[3], rgbaB[3], t).toFixed(3)})`;
  }

  function applyAtmosphere(uRaw, viewportW) {
    const u = Math.max(0, Math.min(1, uRaw));
    let sA = ATMOSPHERE_STOPS[0];
    let sB = ATMOSPHERE_STOPS[ATMOSPHERE_STOPS.length - 1];
    let localT = 0;

    for (let i = 0; i < ATMOSPHERE_STOPS.length - 1; i++) {
      if (u >= ATMOSPHERE_STOPS[i].u && u <= ATMOSPHERE_STOPS[i + 1].u) {
        sA = ATMOSPHERE_STOPS[i];
        sB = ATMOSPHERE_STOPS[i + 1];
        localT = (u - sA.u) / (sB.u - sA.u);
        break;
      }
    }

    const celestialX = lerp(sA.celestialXRatio * viewportW, sB.celestialXRatio * viewportW, localT);
    const style = stageFrame.style;
    style.setProperty('--sky-top', lerpColor(sA.skyTop, sB.skyTop, localT));
    style.setProperty('--sky-mid', lerpColor(sA.skyMid, sB.skyMid, localT));
    style.setProperty('--sky-bottom', lerpColor(sA.skyBottom, sB.skyBottom, localT));
    style.setProperty('--celestial-x', `${celestialX.toFixed(1)}px`);
    style.setProperty('--celestial-y', `${lerp(sA.celestialY, sB.celestialY, localT).toFixed(1)}px`);
    style.setProperty('--celestial-size', `${lerp(sA.celestialSize, sB.celestialSize, localT).toFixed(1)}px`);
    style.setProperty('--celestial-color', lerpColor(sA.celestialColor, sB.celestialColor, localT));
    style.setProperty('--celestial-glow', lerpRgba(sA.celestialGlow, sB.celestialGlow, localT));
    style.setProperty('--mountain-far', lerpColor(sA.mountainFar, sB.mountainFar, localT));
    style.setProperty('--hill-mid', lerpColor(sA.hillMid, sB.hillMid, localT));
    style.setProperty('--hill-near', lerpColor(sA.hillNear, sB.hillNear, localT));
    style.setProperty('--ambient-tint', lerpRgba(sA.ambientTint, sB.ambientTint, localT));
    style.setProperty('--star-opacity', lerp(sA.starOpacity, sB.starOpacity, localT).toFixed(3));
    style.setProperty('--cloud-opacity', lerp(sA.cloudOpacity, sB.cloudOpacity, localT).toFixed(3));
    style.setProperty('--lamp-glow-opacity', lerp(sA.lampGlowOpacity, sB.lampGlowOpacity, localT).toFixed(3));
    style.setProperty('--house-light-opacity', lerp(sA.houseLightOpacity, sB.houseLightOpacity, localT).toFixed(3));
    style.setProperty('--memory-halo', lerpRgba(sA.memoryHalo, sB.memoryHalo, localT));
  }

  const atmosphereMilestones = [

    houseStopX
  ];

  function computeWalkAtmosphereU(momCenterWorld) {
    const count = atmosphereMilestones.length;
    if (count <= 1) return 1;
    if (momCenterWorld <= atmosphereMilestones[0]) return 0;
    if (momCenterWorld >= atmosphereMilestones[count - 1]) return 1;

    for (let i = 0; i < count - 1; i++) {
      const mStart = atmosphereMilestones[i];
      const mEnd = atmosphereMilestones[i + 1];
      if (momCenterWorld >= mStart && momCenterWorld <= mEnd) {
        const segT = (momCenterWorld - mStart) / (mEnd - mStart);
        return (i + segT) / (count - 1);
      }
    }
    return 1;
  }

  // Responsive anchors so mobile & desktop frame Mom and the memory cards cleanly
  function getResponsiveMetrics() {
    const viewportW = stageFrame.clientWidth || window.innerWidth;
    const isMobile = viewportW < 640;
    const momHalfW = isMobile ? 48 : 56;
    const momScreenAnchor = isMobile ? Math.max(54, Math.round(viewportW * 0.16)) : 250;
    const frameWidth = isMobile ? Math.min(214, viewportW - momScreenAnchor - 24) : 258;
    const frameOffsetFromTrigger = isMobile
      ? Math.max(92, viewportW - momScreenAnchor - frameWidth - 14)
      : 320;
    const dissolveLeftThreshold = isMobile ? 22 : 58;

    return {
      viewportW,
      isMobile,
      momHalfW,
      momScreenAnchor,
      frameWidth,
      frameOffsetFromTrigger,
      dissolveLeftThreshold
    };
  }

  function syncChapterPositions() {
    const m = getResponsiveMetrics();
    slots.forEach((slot) => {
      const triggerX = Number(slot.dataset.triggerX);
      const frameX = triggerX + m.frameOffsetFromTrigger;
      slot.dataset.frameX = frameX;
      slot.style.left = `${frameX}px`;
    });
  }

  window.addEventListener('resize', () => {
    syncChapterPositions();
    updateScene();
  });

  function updateScene() {
    const m = getResponsiveMetrics();
    const maxCam = Math.max(0, WORLD_WIDTH - m.viewportW);
    const momCenterWorld = momWorldX + m.momHalfW;

    // Pure 1:1 continuous camera tracking (zero cuts)
    cameraX = clamp(momCenterWorld - m.momScreenAnchor, 0, maxCam);

    // Continuous Morning -> Noon -> Afternoon -> Evening atmosphere progression
    const u = computeWalkAtmosphereU(momCenterWorld);
    applyAtmosphere(u, m.viewportW);

    let currentOpenIdx = -1;

    slots.forEach((slot, idx) => {
      const triggerX = Number(slot.dataset.triggerX);
      const frameWorldX = Number(slot.dataset.frameX);
      const frameScreenX = frameWorldX - cameraX;

      const hasTriggered = momCenterWorld >= triggerX;
      const isBeforeLeftBorder = frameScreenX > m.dissolveLeftThreshold;

      if (hasTriggered && isBeforeLeftBorder) {
        slot.classList.add('is-open');
        slot.classList.remove('is-dissolving');
        currentOpenIdx = idx;
      } else if (hasTriggered && !isBeforeLeftBorder && frameScreenX > -220) {
        slot.classList.remove('is-open');
        slot.classList.add('is-dissolving');
      } else {
        slot.classList.remove('is-open', 'is-dissolving');
      }
    });

    activeSlotIndex = currentOpenIdx;

    // Show "Enter the House" button once Mom reaches the green house
    const hasReachedHouse = momWorldX >= houseStopX - 70;
    enterHouseBtn.classList.toggle('visible', hasReachedHouse);

    worldTrack.style.transform = `translate3d(${-cameraX}px, 0, 0)`;
    cloudLayerEl.style.transform = `translate3d(${-cameraX * 0.14}px, 0, 0)`;
    mountainsLayerEl.style.transform = `translate3d(${-cameraX * 0.22}px, 0, 0)`;
    hillsLayerEl.style.transform = `translate3d(${-cameraX * 0.38}px, 0, 0)`;
  }

    btnEl.addEventListener('pointerup', endMove);

    momSprite.style.left = `${momWorldX}px`;
    momSprite.classList.remove('facing-left');
    updateScene();
  });

  // Optional tap-on-road convenience (ignored when tapping buttons)
  document.getElementById('cement-road').addEventListener('click', (e) => {
    const rect = stageFrame.getBoundingClientRect();
    const clickScreenX = e.clientX - rect.left;
    const m = getResponsiveMetrics();
    targetWorldX = clamp(cameraX + clickScreenX - m.momHalfW, 100, houseStopX);
  });

  // Keyboard arrow keys support
  window.addEventListener('keydown', (e) => {
    if (memoryModal.classList.contains('open')) {
      if (e.key === 'Escape' || e.key === 'Enter' || e.code === 'Space') {
        e.preventDefault();
        memoryModal.classList.remove('open');
      }
      return;
    }
    if (houseModal.classList.contains('open')) {
      if (e.key === 'Escape') houseModal.classList.remove('open');
      return;
    }

    if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') {
      inputState.keyLeft = true;
      targetWorldX = null;
      btnLeft.classList.add('pressed');
    }
    if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') {
      inputState.keyRight = true;
      targetWorldX = null;
      btnRight.classList.add('pressed');
    }
    if ((e.key === 'Enter' || e.code === 'Space') && activeSlotIndex !== -1) {
      e.preventDefault();
      openMemoryModal(activeSlotIndex);
    }
  });

  window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') {
      inputState.keyLeft = false;
      btnLeft.classList.remove('pressed');
    }
    if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') {
      inputState.keyRight = false;
      btnRight.classList.remove('pressed');
    }
  });

  window.addEventListener('blur', () => {
    inputState.keyLeft = false;
    inputState.keyRight = false;
    inputState.btnLeft = false;
    inputState.btnRight = false;
    btnLeft.classList.remove('pressed');
    btnRight.classList.remove('pressed');
  });

  /* ==========================================================================
     8. MAIN ANIMATION LOOP
     ========================================================================== */
  function tick() {
    let dx = 0;
    const walkSpeed = 4.5;
    const modalOpen = memoryModal.classList.contains('open') || houseModal.classList.contains('open');

    if (!modalOpen) {
      const goLeft = inputState.keyLeft || inputState.btnLeft;
      const goRight = inputState.keyRight || inputState.btnRight;

      if (goLeft && !goRight) dx = -walkSpeed;
      else if (goRight && !goLeft) dx = walkSpeed;
      else if (targetWorldX !== null) {
        const diff = targetWorldX - momWorldX;
        if (Math.abs(diff) > 4) {
          dx = Math.sign(diff) * walkSpeed;
        } else {
          momWorldX = targetWorldX;
          targetWorldX = null;
        }
      }
    }

    if (dx !== 0) {
      momWorldX = clamp(momWorldX + dx, 100, houseStopX);
      momSprite.style.left = `${momWorldX}px`;
      momSprite.classList.add('is-walking');
      momSprite.classList.toggle('facing-left', dx < 0);

      if (isCurrentlyFrontPose) {
        isCurrentlyFrontPose = false;
        chibiMount.innerHTML = chibiWalkFramesSVG[currentWalkIdx];
      }
      walkCycleTimer += Math.abs(dx);
      if (walkCycleTimer >= 26) {
        walkCycleTimer = 0;
        currentWalkIdx = (currentWalkIdx + 1) % chibiWalkFramesSVG.length;
        chibiMount.innerHTML = chibiWalkFramesSVG[currentWalkIdx];
      }
    } else {
      momSprite.classList.remove('is-walking');
      if (!isCurrentlyFrontPose) {
        isCurrentlyFrontPose = true;
        chibiMount.innerHTML = chibiFrontSVG;
      }
    }

    updateScene();
    requestAnimationFrame(tick);
  }

  syncChapterPositions();
  updateScene();
  requestAnimationFrame(tick);
</script>
</body>
